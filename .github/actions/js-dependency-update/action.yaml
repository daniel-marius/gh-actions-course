name: Update NPM Dependencies
description: Checks if there are updates to NPM packages, and creates a PR with the updated package*.json files.

inputs:
  base-branch:
    description: The branch used as the base for the dependency update checks
    default: main
    required: false
  target-branch:
    description: update-Dependencies
    default: update-dependencies
  working-directory:
    description: The working directory of the project to check for dependency updates
    required: true
  gh-token:
    description: Authntication token with repository access. Must have write access to contents and pull-request
    required: true
  debug:
    description: Whether to output debug messages to the console
    default: 'false'
runs:
  using: node24
  main: index.js